name: LKG drift gate

# Last-known-good drift gate (ADR-006 §"Tracking canonical via a last-known-good gate").
# Daily: verify every patch against canonical; advance `last-known-good` when green and
# canonical moved; open a retirement PR when a patch's fix has landed upstream.
# On PR: verify only — never advance the pointer (review-time correctness check).
# No notification integration by design — a red run is the signal (owner preference).

on:
  schedule:
    # 07:17 UTC daily — a quiet hour, off the top-of-hour Actions congestion.
    - cron: '17 7 * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # commit `last-known-good`
  pull-requests: write     # open retirement PRs

concurrency:
  group: lkg-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patches repo
        uses: actions/checkout@v4

      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          jq --version

      - name: Ensure node
        # The gate shells out to scripts/derive-surfaces.mjs for the ADR-008
        # runtime-surface drift check. Node is preinstalled on ubuntu-latest;
        # pin it for determinism.
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run drift gate
        id: gate
        # WRITE_LKG=1 enables file-writing for the per-ledger LKG advances.
        # In PR-trigger mode, omit it — review-time correctness check only.
        env:
          WRITE_LKG: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: |
          set +e
          # The script appends sha/changed/all_ok/obsolete to $GITHUB_OUTPUT
          # itself (plus sha_<slug>/changed_<slug>/all_ok_<slug>/lkg_file_<slug>
          # for each ledger so multi-canonical workflows can route advances);
          # we add rc. Stdout (the first ledger's verified SHA) is captured
          # for logs.
          bash scripts/lkg-gate.sh
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Commit per-ledger LKG advances
        # Cron/dispatch only, all patches green. The gate has already written
        # whichever LKG files advanced (their canonicals moved); this step
        # commits whatever changed in the working tree across all LKG files.
        if: >-
          github.event_name != 'pull_request' &&
          steps.gate.outputs.all_ok == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- '*last-known-good*'; then
            echo "No LKG file changes — canonical(s) hadn't moved since last verified run."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add '*last-known-good*'
          # Single commit covering all LKG advances this run. The diff itself
          # tells the audit story (per-canonical SHAs as plain text).
          git commit -m "chore(lkg): advance LKG pointer(s)

          All patches verified by the daily drift gate. See the diff for
          per-canonical SHA advances."
          git push

      - name: Publish a release when main has moved past the latest one
        # Cron/dispatch only, all patches green. Demo Builder reads the ledgers and
        # the LKG pointers at this repo's LATEST RELEASE (one snapshot, both
        # together), so a verified `main` nobody releases never reaches a
        # storefront. Until 2026-10-16 this step did not exist: v1.0.0 was the only
        # release for seven weeks, and every project started on, and compared its
        # updates against, the 2026-08-28 boilerplate while this gate verified 73
        # newer commits. Comparing HEAD with the latest release (rather than "did
        # the pointer move") also releases a merged ledger change, once a daily
        # run has verified it.
        if: >-
          github.event_name != 'pull_request' &&
          steps.gate.outputs.all_ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$latest" ]; then
            released="$(gh api "repos/$GITHUB_REPOSITORY/commits/$latest" --jq .sha)"
            if [ "$released" = "$head" ]; then
              echo "main is already released as $latest — nothing to publish."
              exit 0
            fi
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          else
            next="v1.0.0"
          fi
          notes="$(printf 'Published by the daily drift gate: every patch verified against canonical.\n\nVerified canonical commits (last-known-good):\n')"
          for f in last-known-good */last-known-good; do
            [ -e "$f" ] && notes="${notes}"$'\n'"- \`${f}\`: \`$(cat "$f")\`"
          done
          gh release create "$next" --repo "$GITHUB_REPOSITORY" --target "$head" \
            --title "$next" --notes "$notes" --latest
          echo "Published $next at $head."

      - name: Retire patches upstream now ships byte for byte
        # Cron/dispatch only. The gate flagged patches whose precondition is gone
        # and whose replacement is present EXACTLY: upstream ships the very code the
        # patch wrote. Remove each from the one ledger it was found in, as a commit
        # straight to main (owner, 2026-10-16): removing it changes no storefront
        # byte. Until then a human merged these, because equivalence "can be
        # subtle"; an exact match is not subtle, and a fix made differently is
        # FIXED_DIFFERENTLY, which still waits for a person. No PR: one opened and
        # merged in the same run left its queued checks to fail on a deleted branch,
        # and every one of those failures emailed the owner (live test, 2026-10-16).
        if: >-
          github.event_name != 'pull_request' &&
          steps.gate.outputs.obsolete != ''
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for entry in ${{ steps.gate.outputs.obsolete }}; do
            ledger_dir="${entry%%:*}"
            id="${entry#*:}"
            # Only the ledger whose canonical now has the fix: a patch shared by
            # ledgers on two canonicals may be fixed in only one of them.
            ledger="${ledger_dir}/code-patches.json"
            tmp="$(mktemp)"
            jq --arg id "$id" '.patches |= map(select(.id != $id))' "$ledger" > "$tmp"
            mv "$tmp" "$ledger"
            git add "$ledger"
            if git diff --cached --quiet; then
              echo "No ledger change for '$entry' — skipping."
              continue
            fi
            git commit -m "chore(lkg): retire '${id}' from ${ledger_dir}: upstream ships its fix byte for byte

          The daily drift gate found the precondition gone and the replacement present
          exactly in canonical ${{ steps.gate.outputs.sha }}. Removing the patch changes no
          storefront byte."
          done
          git push

      - name: Open re-anchor PRs for patches upstream only reformatted
        # Cron/dispatch only. The gate found patches whose precondition is still in
        # canonical once whitespace is ignored (re-indented, re-wrapped) and wrote
        # the file's exact new text to .lkg-proposals/reanchor/<ledger>__<id>.txt
        # (scripts/reanchor.mjs). Propose the ledger update; a human merges for now.
        # A PR this workflow opens queues the PR-time checks, but GitHub holds them
        # until a maintainer presses "Approve and run" on the PR (live test,
        # 2026-10-16). The new anchor matches exactly once in canonical by
        # construction; approving the check is how a person sees it verified.
        if: >-
          github.event_name != 'pull_request' &&
          steps.gate.outputs.reanchor != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(git rev-parse --abbrev-ref HEAD)"
          for entry in ${{ steps.gate.outputs.reanchor }}; do
            ledger_dir="${entry%%:*}"
            id="${entry#*:}"
            proposal=".lkg-proposals/reanchor/${ledger_dir}__${id}.txt"
            branch="lkg/reanchor-${ledger_dir}-${id}"
            if gh pr list --head "$branch" --state open --json number --jq 'length' | grep -q '^[1-9]'; then
              echo "Re-anchor PR for '$entry' already open — skipping."
              continue
            fi
            git checkout -B "$branch" "$base"
            ledger="${ledger_dir}/code-patches.json"
            tmp="$(mktemp)"
            jq --arg id "$id" --rawfile pre "$proposal" \
              '.patches |= map(if .id == $id then .precondition = $pre else . end)' "$ledger" > "$tmp"
            mv "$tmp" "$ledger"
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add "$ledger"
            if git diff --cached --quiet; then
              echo "No ledger change for '$entry' — skipping."
              git checkout -q "$base"
              continue
            fi
            git commit -m "chore(lkg): re-anchor '${id}' in ${ledger_dir} (upstream reformatted it)"
            git push -u origin "$branch" --force-with-lease
            gh pr create \
              --base "$base" \
              --head "$branch" \
              --title "chore(lkg): re-anchor '${id}' in ${ledger_dir}" \
              --body "Upstream changed only the whitespace inside the code \`${id}\` patches (re-indented or re-wrapped), so the patch no longer fit as written. This updates its precondition to canonical's exact new text; the replacement is unchanged.

          Found by \`scripts/reanchor.mjs\`: the same sequence of code, differing only in whitespace, exactly once in the target file. Its one known limit: spacing inside a string literal counts as whitespace. Merge it, and the next daily run verifies every patch and publishes the release.

          Canonical SHA: \`${{ steps.gate.outputs.sha }}\`"
            git checkout -q "$base"
          done

      - name: Open PR for runtime-surface drift
        # Cron/dispatch only. The gate's surface check (ADR-008) wrote a
        # `runtime-surfaces.json.proposed` for any ledger whose boilerplate now
        # references a runtime surface the committed `derived` block is missing
        # (or no longer references one it lists). Propose the refreshed `derived`
        # block; a human merges (the `residual` block is preserved untouched).
        # Advisory — independent of the patch pass/fail above.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          proposed=( */runtime-surfaces.json.proposed )
          if [ ${#proposed[@]} -eq 0 ]; then
            echo "No runtime-surface drift — nothing to propose."
            exit 0
          fi
          base="$(git rev-parse --abbrev-ref HEAD)"
          branch="lkg/surface-drift"
          git checkout -B "$branch" "$base"
          summary=""
          for p in "${proposed[@]}"; do
            real="${p%.proposed}"
            mv "$p" "$real"
            summary="${summary}- \`${real}\`"$'\n'
          done
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ./*/runtime-surfaces.json
          if git diff --cached --quiet; then
            echo "Proposed files matched committed — nothing to commit."
            exit 0
          fi
          git commit -m "chore(surfaces): refresh derived runtime surfaces from canonical"
          git push -u origin "$branch" --force-with-lease
          # Reuse an open PR for this branch if present; otherwise open one.
          if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" -ge 1 ]; then
            echo "Surface-drift PR already open — updated its branch."
            exit 0
          fi
          gh pr create \
            --base "$base" \
            --head "$branch" \
            --title "chore(surfaces): refresh derived runtime surfaces from canonical" \
            --body "The daily drift gate re-derived the storefront runtime surfaces from canonical and found the committed \`derived\` block is out of date (ADR-008). Files updated:

          ${summary}
          The machine-owned \`derived\` block was regenerated; the human-owned \`residual\` block is untouched. **Per-surface provenance (file:line) is in the 'Run drift gate' logs** under each \`+ /…\` line. Automation proposes; review the additions (is a new surface really needed, or variant-only?) before merging."

      - name: Fail the run if any patch did not verify
        # Keeps the gate red on breakage/obsolete so it is the signal, and keeps
        # the LKG pointer pinned until the patches repo is fixed.
        if: steps.gate.outputs.all_ok != 'true'
        run: |
          echo "::error::Drift gate red — one or more patches did not verify cleanly. See the 'Run drift gate' logs."
          exit 1
